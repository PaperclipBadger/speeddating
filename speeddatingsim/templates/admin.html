{% extends 'layout.html' %}

{% block content %}
<h2>THE ADMIN PAGE</h2>

<p>Here are all the users on the site:</p>
<ul>
    {% for other in users %}
    <li>{{ other.name }}
        {% if admin %}
        <form action="{{ url_for('admin_user_delete', sessionid=session.id) }}" method="POST"
            style="display: inline !important;">
            <input hidden name="user" value="{{ other.id }}">
            <input type="submit" value="delete forever">
        </form>
        <details>
            <summary>Recovery Phrase</summary>
            {{ other.id|recovery_phrase }}
        </details>
        {% endif %}
    </li>
    {% endfor %}
</ul>
{% endblock %}
